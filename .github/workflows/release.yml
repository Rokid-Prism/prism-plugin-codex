name: Release plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    env:
      PRISM_PLATFORM: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmmirror.com/
          cache: npm
      - name: Require a reproducible SDK lockfile
        shell: bash
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test
        run: |
          npm run build --if-present
          npm test
      - name: Verify manifest and release version
        shell: bash
        run: node scripts/verify-release.mjs
      - name: Protocol probe on the target runner
        run: node scripts/probe.mjs
      - name: Keep only runtime dependencies
        run: npm prune --omit=dev
      - name: Stage target package
        shell: bash
        run: |
          node scripts/stage-release.mjs
          plugin_id=$(node -e "console.log(require('fs').readFileSync('pluginbridge-plugin.yaml','utf8').match(/^id:\\s*(.+)$/m)[1].trim())")
          version=$(node -e "console.log(require('fs').readFileSync('pluginbridge-plugin.yaml','utf8').match(/^version:\\s*(.+)$/m)[1].trim())")
          tar -C "release/${plugin_id}-${version}-${PRISM_PLATFORM}" -czf "$PWD/release/${plugin_id}-${version}-${PRISM_PLATFORM}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate checked release metadata
        run: node scripts/create-release-metadata.mjs release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A moved tag or a rerun must rebuild the release instead of failing
        # on the stale one; the artifacts are regenerated either way.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
